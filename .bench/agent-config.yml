# Reference solution — NOT shown to the agent. Its purpose is to prove the task is
# solvable and to give the verifier a known-good state to be tested against.
version: 2.1

jobs:
  build:
    docker:
      - image: cimg/base:current
    steps:
      - checkout
      - run:
          name: Install Go 1.22
          command: circleci run circleci/setup-go@0.0.11-94c150b -- install --version 1.22
      # Separate step on purpose: setup-go exports PATH through $BASH_ENV, which
      # CircleCI sources between steps.
      - run:
          name: Build
          command: go build ./...

workflows:
  build:
    jobs:
      - build
