version: 2.1

jobs:
  build:
    docker:
      # Plain base image: the Go toolchain is installed explicitly below so the
      # build never depends on whatever version the image happens to ship.
      - image: cimg/base:current
    steps:
      - checkout
      - run:
          name: Set up Go 1.22
          # Pinned to the 1.22 minor series (newest stable go1.22.x), as
          # standardised by the platform team. Not --version-file: go.mod
          # declares 1.21, which is the module's language level, not the
          # toolchain we want to build with.
          command: circleci run circleci/setup-go@0.0.11-94c150b -- install --version 1.22
      - run:
          name: Report Go version
          command: go version
      - run:
          name: Build all packages
          # ./... covers the root tokenbucket package and cmd/tokenbucket.
          command: go build ./...

workflows:
  build:
    # No branch filters: runs on every push.
    jobs:
      - build
