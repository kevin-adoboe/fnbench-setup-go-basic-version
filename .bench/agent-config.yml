version: 2.1

jobs:
  build:
    docker:
      # Plain Ubuntu-based image with no Go preinstalled: the toolchain comes
      # from setup-go below, so the Go version is pinned by this config rather
      # than by whatever the image happens to ship.
      - image: cimg/base:current
    steps:
      - checkout
      - run:
          name: Install Go 1.22
          command: circleci run circleci/setup-go@0.0.11-94c150b -- install --version 1.22
      - run:
          name: Report Go version
          command: go version
      - run:
          name: Build all packages
          command: go build ./...

workflows:
  build:
    jobs:
      - build
