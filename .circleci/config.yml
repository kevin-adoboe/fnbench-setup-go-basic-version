version: 2.1
jobs:
  build:
    docker:
    - image: cimg/go:1.22
    environment:
      GOTOOLCHAIN: local
    steps:
    - checkout
    - run:
        name: Verify Go 1.22 toolchain
        command: "go version\ncase \"$(go env GOVERSION)\" in\n  go1.22 | go1.22.*)\n    echo \"Using $(go env GOVERSION)\
          \ as required.\"\n    ;;\n  *)\n    echo \"ERROR: expected Go 1.22.x, got $(go env GOVERSION)\" >&2\n    exit 1\n\
          \    ;;\nesac\n"
    - run:
        name: Build all packages
        command: go build ./...
    - run:
        name: benchmark verifier
        when: always
        command: 'set +e

          python3 .bench/verify.py --workspace . > /tmp/bench-verifier.json 2> /tmp/bench-verifier.err

          echo "---BENCH-VERIFIER-JSON-START---"

          cat /tmp/bench-verifier.json

          echo "---BENCH-VERIFIER-JSON-END---"

          echo ''--- verifier stderr ---'' >&2

          cat /tmp/bench-verifier.err >&2

          exit 0

          '
workflows:
  build:
    jobs:
    - build
